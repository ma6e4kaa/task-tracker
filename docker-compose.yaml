services:
    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        env_file:
            - .env
        volumes:
            - ./docker/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./public:/var/www/html
        networks:
            - app-network

    php:
        build:
            context: .
            dockerfile: docker/dev/Dockerfile
        env_file:
            - .env
        volumes:
            - .:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/dev.ini
            - symfony_cache:/var/www/html/var/cache
        networks:
            - app-network

    postgres:
        image: postgres:16-alpine
        ports:
            - "5432:5432"
        restart: always
        environment:
            - POSTGRES_PASSWORD=password
        env_file:
            - .env
        volumes:
            - ./var/postgresql/data:/var/lib/postgresql/data
            - ./var/postgresql/logs:/var/log/postgresql:cached
        networks:
            - app-network

    rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=app
            - RABBITMQ_DEFAULT_PASS=secret
        volumes:
            - ./var/rabbitmq/data:/var/lib/rabbitmq
            - ./var/rabbitmq/logs:/var/log/rabbitmq
        networks:
            - app-network

    redis:
        image: redis:7.4-alpine
        ports:
            - "6379:6379"
        networks:
            - app-network
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
            - WATCHPACK_POLLING=true
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    symfony_cache:
