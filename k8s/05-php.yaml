apiVersion: apps/v1
kind: Deployment
metadata:
    name: php
    namespace: task-tracker
spec:
    replicas: 1
    selector:
        matchLabels:
            app: php
    template:
        metadata:
            labels:
                app: php
        spec:
            containers:
                - name: php
                  image: task-tracker-php:latest
                  imagePullPolicy: Never
                  ports:
                      - containerPort: 9000
                  envFrom:
                      - secretRef:
                            name: app-secrets
                  env:
                      - name: APP_ENV
                        value: "prod"
                      - name: APP_DEBUG
                        value: "0"
---
apiVersion: v1
kind: Service
metadata:
    name: php
    namespace: task-tracker
spec:
    selector:
        app: php
    ports:
        - port: 9000
          targetPort: 9000
