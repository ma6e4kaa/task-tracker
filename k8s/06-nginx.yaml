apiVersion: v1
kind: ConfigMap
metadata:
    name: nginx-config
    namespace: task-tracker
data:
    default.conf: |
        server {
            listen 80;
            server_name _;
            root /var/www/html/public;
            index index.php;

            location / {
                try_files $uri /index.php$is_args$args;
            }

            location ~ \.php$ {
                fastcgi_pass php:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
                fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: nginx
    namespace: task-tracker
spec:
    replicas: 1
    selector:
        matchLabels:
            app: nginx
    template:
        metadata:
            labels:
                app: nginx
        spec:
            containers:
                - name: nginx
                  image: nginx:alpine
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 80
                  volumeMounts:
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d
            volumes:
                - name: nginx-config
                  configMap:
                      name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
    name: nginx
    namespace: task-tracker
spec:
    selector:
        app: nginx
    ports:
        - port: 80
          targetPort: 80
